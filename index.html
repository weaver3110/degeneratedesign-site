<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degenerate Design</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#1c1e1a;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:520px;padding:40px 24px;text-align:center}
  h1{font-size:26px;letter-spacing:-.01em;margin:0 0 8px}
  p{color:#6b6f66;margin:0 0 22px}
  .links a{display:inline-block;margin:0 10px;color:#8a5a2b;text-decoration:none;font-weight:600}
  .links a:hover{text-decoration:underline}
  @media (prefers-color-scheme:dark){
    body{background:#161814;color:#e7e4da} p{color:#9a9c90} .links a{color:#cf9a5e}
  }
</style>
</head>
<body>
<main>
  <h1>Degenerate Design LLC</h1>
  <p>Maker of Oldschool MTG.</p>
  <div class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </div>
</main>
</body>
</html>
